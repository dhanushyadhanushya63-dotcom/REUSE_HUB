# ============================================================
# ReUseHub Spring Boot Configuration
# ============================================================

server.port=8080
spring.application.name=reusehub-marketplace

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/reusehub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Local Upload Directory
upload.path=./public/uploads/

# JWT Configuration
app.jwt.secret=ReUseHubSuperSecretKeyForJwtSigningTokenMustBeAtLeast256BitsLong2026
app.jwt.expiration-ms=86400000
